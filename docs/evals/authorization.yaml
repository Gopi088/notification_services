version: 1
category: authorization
evals:
  - eval_id: EVAL-AUTHZ-001
    version: 1
    scenario: User A can view their own notification.
    input: {actor: usr_A, resource: notification_owned_by_A}
    preconditions: {auth_enabled: true, two_users: true}
    expected_behavior: ["HTTP 200", "can read own"]
    evidence: [http_status]
    graders: ["http_status == 200"]
    critical: true
    pass_criteria: "all graders pass"

  - eval_id: EVAL-AUTHZ-002
    version: 1
    scenario: User A cannot view User B's notification.
    input: {actor: usr_A, resource: notification_owned_by_B}
    preconditions: {auth_enabled: true, two_users: true}
    expected_behavior: ["HTTP 403 forbidden", "no data leak"]
    evidence: [http_status, response_body]
    graders: ["http_status == 403", "response contains no B data"]
    critical: true
    pass_criteria: "all graders pass"

  - eval_id: EVAL-AUTHZ-003
    version: 1
    scenario: User A cannot cancel/modify User B's notification.
    input: {actor: usr_A, action: cancel, resource: notification_owned_by_B}
    preconditions: {auth_enabled: true, two_users: true}
    expected_behavior: ["HTTP 403", "B's notification unchanged"]
    evidence: [http_status, notification_state]
    graders: ["http_status == 403", "notification unchanged"]
    critical: true
    pass_criteria: "all graders pass"

  - eval_id: EVAL-AUTHZ-004
    version: 1
    scenario: Admin can access any user's notification.
    input: {actor: admin, resource: notification_owned_by_B}
    preconditions: {auth_enabled: true, admin_role: true}
    expected_behavior: ["HTTP 200"]
    evidence: [http_status]
    graders: ["http_status == 200"]
    critical: true
    pass_criteria: "all graders pass"

  - eval_id: EVAL-AUTHZ-005
    version: 1
    scenario: Missing authentication on a protected endpoint.
    input: {actor: none}
    preconditions: {auth_enabled: true}
    expected_behavior: ["HTTP 401"]
    evidence: [http_status]
    graders: ["http_status == 401"]
    critical: true
    pass_criteria: "all graders pass"

  - eval_id: EVAL-AUTHZ-006
    version: 1
    scenario: Invalid API key rejected.
    input: {actor: wrong_key}
    preconditions: {auth_enabled: true}
    expected_behavior: ["HTTP 401"]
    evidence: [http_status]
    graders: ["http_status == 401"]
    critical: true
    pass_criteria: "all graders pass"

  - eval_id: EVAL-AUTHZ-007
    version: 1
    scenario: Authorization denial is audited.
    input: {actor: usr_A, resource: notification_owned_by_B}
    preconditions: {auth_enabled: true, two_users: true}
    expected_behavior: ["audit record authorization_denied"]
    evidence: [audit_rows]
    graders: ["audit contains authorization_denied"]
    critical: false
    pass_criteria: "all graders pass"
