[pytest]
testpaths = tests test_webhooks.py test_vonage_whatsapp.py
# Coverage measures the application package only (the CLI entry point and the
# standalone root test_*.py runners are not part of the pytest-measured unit).
# Gate: overall >= 90% (see .coveragerc fail_under).
addopts = -q --cov=app --cov-report=term-missing --cov-fail-under=90
filterwarnings =
    ignore::DeprecationWarning
